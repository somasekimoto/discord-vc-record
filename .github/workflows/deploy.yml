# main の CI(ci.yml の gate)が通ったら、変更のあった側だけ本番へデプロイする。
#
# - recorder(Fly): 録音中・文字起こし中は再起動しない(scripts/wait-recorder-idle.sh で最大 3 時間待つ)。
#   デプロイ後に Discord へのログインがログに出なければ、直前のイメージへ戻す。
# - web(Cloudflare Workers): wrangler deploy 後にトップページが 200 を返さなければ直前の版へ戻す。
#
# fly.toml / wrangler.toml は git に入れない方針なので、中身を secrets から復元する。
# secrets は GitHub Environment「production」(デプロイ可能なブランチを main に限定)に置く。
# repo secrets に置くと、どのブランチの workflow からでも読めてしまうため。
# 必要な environment secrets:
#   FLY_API_TOKEN          fly tokens create deploy -a <recorder app>   (そのアプリ限定)
#   RECORDER_FLY_TOML      recorder/fly.toml の中身
#   CLOUDFLARE_API_TOKEN   Workers Scripts:Edit(このアカウント限定)
#   CLOUDFLARE_ACCOUNT_ID
#   WEB_WRANGLER_TOML      web/wrangler.toml の中身
#
# workflow_run は既定ブランチの定義で動くため、このファイルは main に入ってから効く(PR では試せない)。
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: デプロイ対象
        type: choice
        options: [both, recorder, web]
        default: both

permissions:
  contents: read
  actions: read # 前回成功したデプロイの SHA を調べるため

concurrency:
  group: deploy
  cancel-in-progress: false # 進行中のデプロイは止めない

jobs:
  changes:
    # 本番に出すのはマージ済みの main だけ(手動起動も main 以外からは動かない)。
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.diff.outputs.sha }}
      recorder: ${{ steps.diff.outputs.recorder }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - id: diff
        env:
          TARGET: ${{ inputs.target }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # 遅れて終わった古い CI run で、新しい版の後に古いコードを出さない。
          tip=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$sha" != "$tip" ]; then
            echo "$sha is no longer the tip of main ($tip); skipping"
            echo recorder=false >> "$GITHUB_OUTPUT"
            echo web=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$TARGET" ]; then
            case "$TARGET" in recorder|both) echo recorder=true >> "$GITHUB_OUTPUT";; esac
            case "$TARGET" in web|both) echo web=true >> "$GITHUB_OUTPUT";; esac
            exit 0
          fi
          # 前回成功したデプロイからの差分で判定する。複数コミットの push や、
          # 同時実行の制御で待機中の run が置き換えられた場合も変更を取りこぼさない。
          base=$(gh api "repos/$REPO/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')
          if [ -n "$base" ] && git fetch -q --depth=200 origin main && git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "diff since the last successful deploy: $base"
          else
            base=HEAD^1
            echo "no earlier successful deploy found; diff against $base"
          fi
          files=$(git -c core.quotePath=false diff --no-renames --name-only "$base" HEAD)
          printf '%s\n' "$files"
          has() { if grep -q "^$1/" <<< "$files"; then echo true; else echo false; fi; }
          echo "recorder=$(has recorder)" >> "$GITHUB_OUTPUT"
          echo "web=$(has web)" >> "$GITHUB_OUTPUT"

  recorder:
    needs: changes
    if: needs.changes.outputs.recorder == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 240
    defaults:
      run:
        working-directory: recorder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
      # サードパーティの action はコミットで固定する(デプロイトークンを扱うため)。
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - name: Restore fly.toml
        env:
          FLY_TOML: ${{ secrets.RECORDER_FLY_TOML }}
        run: |
          test -n "$FLY_TOML" || { echo "RECORDER_FLY_TOML is not set" >&2; exit 1; }
          printf '%s\n' "$FLY_TOML" > fly.toml
          app=$(sed -nE 's/^app *= *"([^"]+)".*/\1/p' fly.toml)
          test -n "$app"
          echo "APP=$app" >> "$GITHUB_ENV"
      # 先にイメージだけ作る。opus のネイティブビルドで数分かかるので、待機確認の後にやると
      # その間に始まった録音が再起動で切れる。
      - name: Build and push the image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --remote-only --build-only --push --config fly.toml --image-label "ci-${GITHUB_SHA::12}-${GITHUB_RUN_ID}"
          echo "NEW_IMAGE=registry.fly.io/$APP:ci-${GITHUB_SHA::12}-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
      - name: Remember the current image for rollback
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          prev=$(flyctl image show -a "$APP" --json | jq -r 'if type=="array" then .[0] else . end | "\(.Registry)/\(.Repository):\(.Tag)"')
          echo "current image: $prev"
          echo "PREV_IMAGE=$prev" >> "$GITHUB_ENV"
      - name: Wait until not recording or transcribing
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: ../scripts/wait-recorder-idle.sh "$APP" 10800
      - name: Deploy
        id: deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          flyctl deploy --ha=false --config fly.toml --image "$NEW_IMAGE"  # 単一インスタンス必須(README)
      - name: Check the bot logged in to Discord
        id: health
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          for _ in $(seq 1 18); do
            # flyctl logs はパイプ先でも時刻に色付けの制御文字を付けるので、外してから比べる。
            if flyctl logs -a "$APP" --no-tail 2>/dev/null \
                | sed -E 's/\x1b\[[0-9;]*m//g' \
                | awk -v s="$STARTED" '$1 >= s' | grep -q '\[bot\] logged in as'; then
              echo "bot is online"; exit 0
            fi
            sleep 10
          done
          echo "no login log within 3 minutes" >&2
          exit 1
      # 新しいイメージでマシンを更新した後の失敗(deploy 自体の失敗・ログイン確認の失敗)だけ戻す。
      - name: Roll back to the previous image
        if: failure() && (steps.deploy.conclusion == 'failure' || steps.health.conclusion == 'failure')
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --ha=false --config fly.toml --image "$PREV_IMAGE"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: web
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - name: Enable corepack
        run: npm install -g corepack@latest && corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Restore wrangler.toml
        env:
          WRANGLER_TOML: ${{ secrets.WEB_WRANGLER_TOML }}
        run: |
          test -n "$WRANGLER_TOML" || { echo "WEB_WRANGLER_TOML is not set" >&2; exit 1; }
          printf '%s\n' "$WRANGLER_TOML" > wrangler.toml
          base=$(sed -nE 's/^WEB_BASE_URL *= *"([^"]+)".*/\1/p' wrangler.toml)
          test -n "$base"
          echo "BASE=$base" >> "$GITHUB_ENV"
      - run: pnpm run typecheck
      # Cloudflare のトークンはデプロイと戻しの手順にだけ渡す(依存のインストールや typecheck には渡さない)。
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
      - name: Check the site responds
        id: health
        run: |
          for _ in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/" || true)
            if [ "$code" = 200 ]; then echo "site is up"; exit 0; fi
            echo "HTTP $code"
            sleep 5
          done
          echo "site did not return 200 within 60 seconds" >&2
          exit 1
      - name: Roll back to the previous version
        if: failure() && steps.health.conclusion == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler rollback --yes --message "auto rollback - health check failed"
