# web の型検査と認証/認可/配信の回帰、実D1/R2の取り込みスモーク。
name: smoke
on:
  pull_request:
    paths: ['web/**', '.github/workflows/smoke.yml']
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/smoke.yml']

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '22', '24']
    defaults:
      run:
        working-directory: web
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      # pnpm 12 のbinレイアウト対応。既存のcorepack導入順を維持。
      - name: Enable corepack
        run: npm install -g corepack@latest && corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # 実wrangler.toml/secretなしで公開CI設定から毎回生成する。
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Dry-run production entry bundle
        run: pnpm exec wrangler deploy --config wrangler.ci.toml --dry-run
      - name: Apply schema to local D1
        run: pnpm exec wrangler d1 execute vc-record --config wrangler.ci.toml --local --file=schema.sql
      - name: Run local smoke tests
        run: |
          pnpm exec wrangler dev --config wrangler.ci.toml --port 8788 --var INGEST_SECRET:smoke-test-secret > wrangler-dev.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8788/; then
              ready=true
              break
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "wrangler dev did not become ready" >&2
            cat wrangler-dev.log >&2
            exit 1
          fi
          SMOKE_BIG=1 node test/smoke.mts
      - name: Show worker log on failure
        if: failure()
        run: if [ -f wrangler-dev.log ]; then cat wrangler-dev.log; fi
