# recorder のテスト(node:test)。ユニット(発話区間の結合・整形)と、
# 擬似PCM+モックSTTでの pipeline 統合テストを実行する。
# 統合テストは wav 切り出しに ffmpeg を使うためインストールする。
name: recorder-test
on:
  pull_request:
    paths: ['recorder/**', '.github/workflows/recorder-test.yml']
  push:
    branches: [main]
    paths: ['recorder/**', '.github/workflows/recorder-test.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # 1 版の失敗で他の版を打ち切らず、版ごとの結果を全部残す。
      fail-fast: false
      matrix:
        node: [22.18.0, 22, 24]
    defaults:
      run:
        working-directory: recorder
    steps:
      - uses: actions/checkout@v4
      # pnpm は package.json の packageManager 指定に従って corepack が用意する。
      # setup-node の cache: pnpm より前に pnpm が居る必要があるのでこの順番。
      # pnpm 12 (Rust版) は bin レイアウトが変わり古い corepack では解決できないため、
      # corepack を最新へ更新してから enable する。
      - name: Enable corepack
        run: npm install -g corepack@latest && corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: recorder/pnpm-lock.yaml
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # --frozen-lockfile: lockfile と package.json がズレていたら CI を落とす
      - run: pnpm install --frozen-lockfile
      # tsc の結果は実行 Node の版に依存しないので最低対応版で 1 回だけ。
      - run: pnpm run typecheck
        if: matrix.node == '22.18.0'
      - run: pnpm test

  # 本番と同じ --prod install + native stripping。Discord には接続しない。
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # apt / node-gyp(@discordjs/opus) のレイヤを GHA cache で再利用する。load で probe 用にローカルへ残す。
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: recorder
          load: true
          tags: discord-vc-recorder:ts-check
          cache-from: type=gha
          # fork PR の読み取り専用 token では cache 書き込みが拒否されうる。cache は任意なので失敗で落とさない。
          cache-to: type=gha,mode=max,ignore-error=true
      - name: Probe production modules and native Opus
        run: |
          docker run --rm discord-vc-recorder:ts-check node --input-type=module -e '
            await import("./src/recorder.ts");
            await import("./src/pipeline.ts");
            const { default: prism } = await import("prism-media");
            const decoder = new prism.opus.Decoder({ rate: 48000, channels: 2, frameSize: 960 });
            let bytes = 0;
            decoder.on("data", (chunk) => { bytes += chunk.length; });
            await new Promise((resolve, reject) => {
              decoder.on("end", resolve);
              decoder.on("error", reject);
              decoder.end(Buffer.from([0xf8, 0xff, 0xfe]));
            });
            if (bytes === 0) throw new Error("native decoder produced no PCM");
            console.log("module-load-ok", bytes);
          '
